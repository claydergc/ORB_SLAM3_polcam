%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV)
#Camera1.fx: 517.306408
#Camera1.fy: 516.469215
#Camera1.cx: 318.643040
#Camera1.cy: 255.313989

#Camera1.k1: 0.262383
#Camera1.k2: -0.953104
#Camera1.p1: -0.005358
#Camera1.p2: 0.002628
#Camera1.k3: 1.163314

Camera1.fx: 910.1040
Camera1.fy: 911.0008
#Camera1.fy: 334.7362
Camera1.cx: 610.8616
Camera1.cy: 518.0777
#Camera1.cy: 190.3613



# distortion parameters
Camera1.k1: -0.173844839103003
Camera1.k2: 0.083554233514269
Camera1.p1: 0.0
Camera1.p2: 0.0

# Camera frames per second
Camera.fps: 20
#Camera.fps: 5

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Camera resolution
Camera.width: 1224
Camera.height: 1024
#Camera.height: 377

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
#ORBextractor.nFeatures: 280 #here both fails
#ORBextractor.nFeatures: 310
#ORBextractor.nFeatures: 1000 #default
# ORBextractor.nFeatures: 1200 #Works for KG
ORBextractor.nFeatures: 1400
#ORBextractor.nFeatures: 1600
# ORBextractor.nFeatures: 1400
# ORBextractor.nFeatures: 1800
# ORBextractor.nFeatures: 2000 #Works for YW. If I put 2000 on KG it fails

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast
#ORBextractor.iniThFAST: 20
#ORBextractor.iniThFAST: 15
# ORBextractor.iniThFAST: 10
#ORBextractor.iniThFAST: 5
# ORBextractor.minThFAST: 7
# ORBextractor.minThFAST: 4
# ORBextractor.minThFAST: 3
#

# ORBextractor.iniThFAST: 20
# ORBextractor.minThFAST: 7
# ORBextractor.iniThFAST: 15 #default for KG
# ORBextractor.minThFAST: 4  #default for KG
ORBextractor.iniThFAST: 13
ORBextractor.minThFAST: 2
# ORBextractor.iniThFAST: 10

# ORBextractor.minThFAST: 1

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
